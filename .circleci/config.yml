version: 2.1

parameters:
  run_native_linux:
    type: boolean
    default: false
  reviewed_revision:
    type: string
    default: ""
  free_quota_verified:
    type: boolean
    default: false
  free_credit_reserve:
    type: integer
    default: 0
  artifact_retention_days:
    type: integer
    default: 0

jobs:
  coderx-linux:
    parameters:
      platform:
        type: string
      resource:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource >>
    working_directory: ~/magnetapi-native-01710
    environment:
      MAGNET_REVIEWED_REVISION: << pipeline.parameters.reviewed_revision >>
      MAGNET_FREE_CREDIT_RESERVE: << pipeline.parameters.free_credit_reserve >>
      MAGNET_ARTIFACT_RETENTION_DAYS: << pipeline.parameters.artifact_retention_days >>
      MAGNET_CI_PIPELINE_ID: << pipeline.id >>
      MAGNET_CHECKOUT_REPO_ID: << pipeline.git.repo_id >>
      MAGNET_CHECKOUT_REPO_URL: << pipeline.git.repo_url >>
      MAGNET_CHECKOUT_REPO_OWNER: << pipeline.git.repo_owner >>
      MAGNET_CHECKOUT_REPO_NAME: << pipeline.git.repo_name >>
      MAGNET_CHECKOUT_REVISION: << pipeline.git.revision >>
      MAGNET_CONFIG_REPO_NAME: << pipeline.config.repository.name >>
      MAGNET_CONFIG_REPO_URL: << pipeline.config.repository.url >>
      MAGNET_CONFIG_REVISION: << pipeline.config.sha >>
      MAGNET_CONFIG_REF: << pipeline.config.ref >>
      MAGNET_CONFIG_FILE_PATH: << pipeline.config.file_path >>
    steps:
      - run:
          name: Verify exact public branch and reviewed revision before credential-free checkout
          no_output_timeout: 2m
          command: |
            python3 - \<<'PY_CHECK'
            import os,re,subprocess
            assert os.environ['CIRCLE_BRANCH']=='magnetapi/coderx-01710-circle-linux-20261120'
            assert not os.environ.get('CIRCLE_PULL_REQUEST') and not os.environ.get('CIRCLE_PR_NUMBER')
            allowed_urls=['https://github.com/embire2/codex','https://github.com/embire2/codex.git','git@github.com:embire2/codex.git']
            assert os.environ['MAGNET_CHECKOUT_REPO_ID']=='1207130646'
            assert os.environ['MAGNET_CHECKOUT_REPO_OWNER']=='embire2' and os.environ['MAGNET_CHECKOUT_REPO_NAME']=='codex'
            assert os.environ['MAGNET_CHECKOUT_REPO_URL'] in allowed_urls
            assert os.environ['MAGNET_CONFIG_REPO_NAME']=='embire2/codex' and os.environ['MAGNET_CONFIG_REPO_URL'] in allowed_urls
            assert os.environ['MAGNET_CONFIG_REF']=='refs/heads/magnetapi/coderx-01710-circle-linux-20261120'
            assert os.environ['MAGNET_CONFIG_FILE_PATH']=='.circleci/config.yml'
            revision=os.environ['CIRCLE_SHA1'];assert re.fullmatch('[a-f0-9]{40}',revision)
            assert revision==os.environ['MAGNET_REVIEWED_REVISION']
            assert revision==os.environ['MAGNET_CHECKOUT_REVISION']==os.environ['MAGNET_CONFIG_REVISION']
            assert int(os.environ['MAGNET_FREE_CREDIT_RESERVE'])>=5000
            assert int(os.environ['MAGNET_ARTIFACT_RETENTION_DAYS'])==30
            git_env={k:v for k,v in os.environ.items() if k in ['PATH','HOME','TMPDIR','LANG','LC_ALL']}
            git_env.update(GIT_CONFIG_NOSYSTEM='1',GIT_CONFIG_GLOBAL='/dev/null',GIT_TERMINAL_PROMPT='0')
            subprocess.run(['git','-c','credential.helper=','init','control'],env=git_env,check=True,timeout=30)
            subprocess.run(['git','-C','control','-c','credential.helper=','-c','http.extraHeader=','fetch','--depth=1','https://github.com/embire2/codex.git',revision],env=git_env,check=True,timeout=90)
            subprocess.run(['git','-C','control','checkout','--detach','FETCH_HEAD'],env=git_env,check=True,timeout=30)
            PY_CHECK
      - run:
          name: Verify public inputs and build/test/package the native Linux runtime
          no_output_timeout: 15m
          command: timeout 55m python3 control/magnetapi-native/0.171.0/circleci_linux.py << parameters.platform >>
          teardown:
            - store_artifacts:
                path: managed-artifacts
                destination: coderx-01710-<< parameters.platform >>
            - store_artifacts:
                path: managed-diagnostics
                destination: diagnostics-NOT-FOR-RELEASE

workflows:
  coderx-linux-reviewed-manual:
    when:
      and:
        - << pipeline.parameters.run_native_linux >>
        - << pipeline.parameters.free_quota_verified >>
    jobs:
      - coderx-linux:
          name: coderx-linux-x64
          platform: linux-x64
          resource: large
          filters:
            branches:
              only: magnetapi/coderx-01710-circle-linux-20261120
            tags:
              ignore: /.*/
      - coderx-linux:
          name: coderx-linux-arm64
          platform: linux-arm64
          resource: arm.large
          filters:
            branches:
              only: magnetapi/coderx-01710-circle-linux-20261120
            tags:
              ignore: /.*/
